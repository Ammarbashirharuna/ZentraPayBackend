# ============================================
# Integration test config
#
# The datasource is provided at runtime by the Testcontainers Postgres via
# @DynamicPropertySource (see AbstractIntegrationTest). Everything else here is
# a safe, non-secret test value so the application context can start without a
# developer .env file.
# ============================================

# Test-only signing secret (>= 256 bits for HS256). Not a real credential.
jwt.secret=integration-test-secret-key-please-do-not-use-in-production-0123456789
jwt.expiration=86400000

# No external calls in integration tests; keys are blank/dummy.
cashonrails.secret-key=
cashonrails.public-key=
cashonrails.encryption-key=test-encryption-key
cashonrails.rsa-private-key=
cashonrails.webhook-key=
cashonrails.sender-name=ZentraPay

resend.api-key=test-resend-key
resend.from-email=test@example.com

app.base-url=http://localhost:8080
