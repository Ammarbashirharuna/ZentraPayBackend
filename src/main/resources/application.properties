# ============================================
# ZentraPay Backend Configuration
# Values loaded from .env file
# ============================================

spring.application.name=zentrapay-backend
server.port=${SERVER_PORT:8080}

# ============================================
# Database
# ============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ============================================
# Flyway
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================
# JWT
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# CashOnRails (payment provider)
# ============================================
cashonrails.base-url=${CASHONRAILS_BASE_URL:https://mainapi.cashonrails.com/api/v1}
# Secret key: server-side API authorization (Bearer). NEVER expose publicly.
cashonrails.secret-key=${CASHONRAILS_SECRET_KEY:}
# Public key: safe for client-side/inline SDK use.
cashonrails.public-key=${CASHONRAILS_PUBLIC_KEY:}
# Encryption key: used to compute the HMAC-512 Signature header on payouts
# and to verify the payloadsignature header on inbound webhooks.
cashonrails.encryption-key=${CASHONRAILS_ENCRYPTION_KEY:}
# RSA private key (PEM/PKCS8) for the X-Signature (RSA-SHA256) header on payouts.
cashonrails.rsa-private-key=${CASHONRAILS_RSA_PRIVATE_KEY:}
# Webhook bearer key: expected value of the inbound webhook Authorization header.
cashonrails.webhook-key=${CASHONRAILS_WEBHOOK_KEY:}
# Name shown as the sender on payout transfers.
cashonrails.sender-name=${CASHONRAILS_SENDER_NAME:ZentraPay}
# Platform fee taken on each successful payment, in basis points (100 = 1%).
platform.fee-basis-points=${PLATFORM_FEE_BASIS_POINTS:100}


# Resend Email
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL:ammarbashir@appsware.ng.com}

# App Base URL
app.base-url=${APP_BASE_URL:http://localhost:8080}

# CORS
app.cors-origins=${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Rate Limiting
rate-limit.public-max=${RATE_LIMIT_PUBLIC_MAX:15}
rate-limit.public-window-seconds=${RATE_LIMIT_PUBLIC_WINDOW_SECONDS:60}
rate-limit.general-max=${RATE_LIMIT_GENERAL_MAX:100}
rate-limit.general-window-seconds=${RATE_LIMIT_GENERAL_WINDOW_SECONDS:60}

# Payment Reminders
reminder.hours-before-expiry=${REMINDER_HOURS_BEFORE_EXPIRY:24}
reminder.abandoned-hours=${REMINDER_ABANDONED_HOURS:2}

# ============================================
# Swagger
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true

# ============================================
# Actuator
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================
# Logging
# ============================================
logging.level.root=INFO
logging.level.com.zentrapay=DEBUG
logging.level.org.flywaydb=INFO