name: CI Pipeline

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zentrapay
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: zentrapay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zentrapay"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/zentrapay_test
          SPRING_DATASOURCE_USERNAME: zentrapay
          SPRING_DATASOURCE_PASSWORD: testpassword
          JWT_SECRET: ci-test-secret-minimum-32-bytes-long-for-hs512
          RESEND_API_KEY: re_test_key_placeholder
          APP_BASE_URL: http://localhost:8080
        run: ./mvnw clean verify -B

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile check
        run: ./mvnw compile -B -q

      - name: Check for common issues
        run: |
          echo "Checking for System.out/System.err usage..."
          ! grep -rn "System\.\(out\|err\)\.print" src/main/java/ || { echo "Found System.out/err usage in production code"; exit 1; }
          echo "Checking for TODO comments..."
          grep -rn "TODO" src/main/java/ || echo "No TODOs found"
